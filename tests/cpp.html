<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    $
    int a = 10;
    int b = 20;
    int resultado;
    __asm__ (
    "addl %%ebx, %%eax;"
    : "=a" (resultado)
    : "a" (a), "b" (b)
    );

    std::cout << "10 + 20 = " << resultado << std::endl;
    $
</body>
